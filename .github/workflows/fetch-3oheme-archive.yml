# Temporary: downloads the old 3oheme.com blog from the Wayback Machine and commits it.
# Remove once the posts are recovered.
name: Fetch 3oheme.com archive
on:
  push:
    branches: [claude/repo-access-review-t0jznp]
    paths: [".github/workflows/fetch-3oheme-archive.yml", ".github/scripts/fetch_3oheme_archive.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/fetch_3oheme_archive.py
      - name: Commit archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _archive_3oheme
          git commit -m "Add raw Wayback Machine copies of 3oheme.com" || echo "nothing to commit"
          git push
